services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound to 127.0.0.1 — this is the local-dev Postgres with default
    # credentials (openmerch/openmerch). If this compose file is ever run on
    # a non-localhost host (e.g. a VPS), keep the loopback binding or drop
    # the port mapping entirely and put a firewall/reverse-proxy in front.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: openmerch
      POSTGRES_PASSWORD: openmerch
      POSTGRES_DB: openmerch
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bound to 127.0.0.1 — local-dev Redis with no auth configured. If this
    # compose file is ever run on a non-localhost host (e.g. a VPS), keep the
    # loopback binding or drop the port mapping and put a firewall/reverse-
    # proxy in front instead.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # Bound to 127.0.0.1 — local-dev MinIO with default credentials
    # (openmerch/openmerch123). If this compose file is ever run on a
    # non-localhost host (e.g. a VPS), keep the loopback binding or drop
    # these port mappings and put a firewall/reverse-proxy in front instead.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: openmerch
      MINIO_ROOT_PASSWORD: openmerch123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ─────────────────────────────────────────────────────────────────────────
  # Application services (HTTP API + BullMQ worker).
  #
  # These are opt-in via the `app` profile so the default `docker compose up`
  # only starts infrastructure (postgres, redis, minio) — that matches the
  # project's dev stance: hot reload locally via `pnpm dev` / `pnpm worker`.
  #
  # Start with: `docker compose --profile app up`
  # ─────────────────────────────────────────────────────────────────────────
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    # Bound to 127.0.0.1 — this is the dev/local API entrypoint. If this
    # compose file is ever run on a non-localhost host (e.g. a VPS), keep the
    # loopback binding or drop the port mapping and put a firewall/reverse-
    # proxy in front instead.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgres://openmerch:openmerch@postgres:5432/openmerch
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: openmerch
      MINIO_SECRET_KEY: openmerch123
      MINIO_BUCKET: openmerch
      # Comma-separated list of browser origins allowed to call the API. No auth on
      # the API, so never hardcode "*" here — set CORS_ORIGIN in the host .env instead.
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://localhost:3002}"
      # Required in production — the API refuses to start without it. Generate with:
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      # Base URL of the optional AI background-removal microservice (see the
      # `rembg` service below). Left pointing at it even though that service
      # is opt-in: if `rembg` isn't running, the route just gets connection
      # refused and returns 503 — nothing else breaks.
      REMBG_URL: http://rembg:7000
      # Hugging Face token for the AI image generation proxy (POST /api/v1/proxy/ai-image).
      # Optional — get a free one at https://huggingface.co/settings/tokens ("Make calls
      # to Inference Providers" permission). Without it the route returns 503.
      HF_TOKEN: "${HF_TOKEN}"
      # Server-side fallback for the Unsplash proxy (GET /api/v1/proxy/unsplash/search) when no
      # key is stored via the Settings API. Without it the route returns 503.
      VITE_UNSPLASH_ACCESS_KEY: "${VITE_UNSPLASH_ACCESS_KEY}"
      # Verifies the X-WC-Webhook-Signature header on POST /api/v1/orders/webhook/woocommerce.
      # Empty by default (route responds 503) — deliberately NOT defaulted to a hardcoded value
      # here, since that would mean any OpenMerch deployment that forgot to set this could have
      # its order webhook forged using a secret published in this public repo. Must match the
      # WooCommerce plugin's own secret (WooCommerce > OpenMerch settings page in wp-admin). To
      # test against the local `woocommerce-dev` profile below, set
      # WOOCOMMERCE_WEBHOOK_SECRET=openmerch-dev-secret-change-in-production in your host .env
      # first (scripts/wordpress-dev-setup.sh writes that exact same value on the WordPress side).
      WOOCOMMERCE_WEBHOOK_SECRET: "${WOOCOMMERCE_WEBHOOK_SECRET}"
    depends_on:
      - postgres
      - redis
      - minio

  # ─────────────────────────────────────────────────────────────────────────
  # BullMQ worker — runs separately from the HTTP API so heavy rendering
  # doesn't block HTTP requests. Use the `worker` profile to start it:
  #
  #   docker compose --profile worker up --build worker
  #
  # The worker shares the same Dockerfile as the API but overrides the CMD.
  # On Linux (the container OS) node-canvas uses FcConfigAppFontAddFile so
  # custom/Google fonts register correctly — unlike the Windows dev host.
  # ─────────────────────────────────────────────────────────────────────────
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    # The image's HEALTHCHECK curls the API's HTTP health endpoint, which this
    # process doesn't expose — disable it here so the worker isn't marked
    # unhealthy for lacking a port it was never meant to have.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://openmerch:openmerch@postgres:5432/openmerch
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: openmerch
      MINIO_SECRET_KEY: openmerch123
      MINIO_BUCKET: openmerch
      # Must match the API's key — this worker decrypts the same stored secrets.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    depends_on:
      - postgres
      - redis
      - minio

  # ─────────────────────────────────────────────────────────────────────────
  # AI background removal (services/rembg) — a small Python microservice that
  # wraps rembg/u2net to strip image backgrounds for the editor's "remove
  # background" tool. It's gated behind its own `ai` profile — separate from
  # `app`/`worker` — and does NOT start with `docker compose up`, nor with
  # `--profile app` or `--profile worker`. You must opt in explicitly:
  #
  #   docker compose --profile ai up --build rembg
  #
  # Why opt-in: the image bundles Python plus the u2net ONNX model
  # (~176MB), which is a meaningful download/disk cost a minimalist
  # self-hoster who doesn't need AI background removal shouldn't be forced
  # to pay. The named volume below caches the downloaded model under
  # /root/.u2net so it isn't re-fetched on every container restart.
  #
  # If this container isn't running, the API's REMBG_URL simply fails to
  # connect and POST /api/v1/assets/remove-background responds 503 — the
  # rest of the API is unaffected.
  # ─────────────────────────────────────────────────────────────────────────
  rembg:
    profiles: ["ai"]
    build:
      context: ./services/rembg
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - rembg-models:/root/.u2net

  # ─────────────────────────────────────────────────────────────────────────
  # WordPress + WooCommerce — local test environment for
  # plugins/plugin-woocommerce/openmerch-woocommerce/. Entirely separate from
  # everything else here: its own MySQL (WordPress/WooCommerce don't support
  # Postgres), its own opt-in profile. Never starts with plain
  # `docker compose up`, nor `--profile app`/`worker`/`ai` — it's dev tooling
  # for testing that one plugin, not part of running OpenMerch itself:
  #
  #   docker compose --profile app --profile woocommerce-dev up --build
  #
  # (`--profile app` is needed too so the plugin's webhook/"Test connection"
  # button has a real `api` container to reach on the same docker network.)
  #
  # `wordpress-cli` is a one-shot service — it runs scripts/wordpress-dev-setup.sh
  # (installs WordPress, installs+activates WooCommerce, activates this
  # plugin, creates a test product already mapped to the "classic-tshirt"
  # OpenMerch product) and exits; the store keeps running on `wordpress`.
  # ─────────────────────────────────────────────────────────────────────────
  wordpress-mysql:
    profiles: ["woocommerce-dev"]
    image: mysql:8.0
    restart: unless-stopped
    # MySQL 8 auto-generates a self-signed cert and defaults to offering SSL,
    # which newer mysql/mariadb client libraries (as used by WP-CLI's
    # `wp db check` etc.) reject outright ("self-signed certificate in
    # certificate chain") unless the app explicitly trusts it. Simplest fix
    # for this local-only, docker-network-internal database: don't offer SSL
    # at all, so the client never attempts to negotiate/validate it.
    command: ["--skip-ssl"]
    environment:
      MYSQL_ROOT_PASSWORD: openmerch
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - wordpress-mysql-data:/var/lib/mysql

  wordpress:
    profiles: ["woocommerce-dev"]
    image: wordpress:php8.2-apache
    restart: unless-stopped
    # Bound to 127.0.0.1 — this is dev-only tooling for testing the WooCommerce
    # plugin locally, same rationale as every other 127.0.0.1 binding above.
    ports:
      - "127.0.0.1:8090:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress-data:/var/www/html
      # Live-mounts the plugin source — edits under plugins/plugin-woocommerce/
      # take effect on the next page load, no rebuild/restart needed.
      - ./plugins/plugin-woocommerce/openmerch-woocommerce:/var/www/html/wp-content/plugins/openmerch-woocommerce
    depends_on:
      - wordpress-mysql

  wordpress-cli:
    profiles: ["woocommerce-dev"]
    image: wordpress:cli-php8.2
    user: "33:33" # www-data — matches the wordpress service's own file ownership
    environment:
      WORDPRESS_DB_HOST: wordpress-mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress-data:/var/www/html
      - ./plugins/plugin-woocommerce/openmerch-woocommerce:/var/www/html/wp-content/plugins/openmerch-woocommerce
      - ./scripts/wordpress-dev-setup.sh:/wordpress-dev-setup.sh:ro
    entrypoint: ["sh", "/wordpress-dev-setup.sh"]
    depends_on:
      - wordpress
      - wordpress-mysql

  # WordPress's own cron ("pseudo-cron") only fires piggybacked on a real front-end page
  # request — fine on a live site with steady visitor traffic, useless in this dev
  # environment where nothing hits the storefront between manual tests. Without this
  # running, WooCommerce's async webhook delivery (`woocommerce_deliver_webhook_async`,
  # queued via Action Scheduler — see class-openmerch-webhook.php) and everything else
  # WordPress schedules just sit queued forever until someone runs
  # `wp cron event run --due-now` by hand, which is what this loop now does for you.
  # This is a dev-only stand-in for the real cron job a production deployment needs
  # instead (a system crontab entry — see plugins/plugin-woocommerce/openmerch-woocommerce/
  # README.md for the copy-paste snippet). Runs continuously; a persistent Action Scheduler
  # runner process would be overkill for a low-traffic dev site, so polling every 60s
  # (roughly matching typical production cron cadence) is enough here.
  wordpress-cron:
    profiles: ["woocommerce-dev"]
    image: wordpress:cli-php8.2
    user: "33:33" # www-data — matches the wordpress service's own file ownership
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: wordpress-mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress-data:/var/www/html
      # Without this, this container doesn't load the plugin at all (the bind mount is
      # what actually puts openmerch-woocommerce's files at this path — the named volume
      # above has nothing of its own there), so none of it runs here: no webhook
      # registration, and critically, none of the http_request_host_is_external /
      # http_allowed_safe_ports filters class-openmerch-webhook.php registers to let
      # wp_safe_remote_request() (which WC_Webhook::deliver() uses) through to a private
      # Docker-network host like `api`. Without them this container's cron silently
      # can't deliver anything — same failure mode, and same fix, as the original bug.
      - ./plugins/plugin-woocommerce/openmerch-woocommerce:/var/www/html/wp-content/plugins/openmerch-woocommerce
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          wp cron event run --due-now --path=/var/www/html --allow-root || true
          sleep 60
        done
    depends_on:
      - wordpress
      - wordpress-mysql

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rembg-models:
  wordpress-mysql-data:
  wordpress-data:
